# ── tmux config for `task dev:start` ─────────────────────────────────────────
# Loaded explicitly by the `dev:start` task (tmux source-file). Not a user config,
# and it is not read by any tmux you start yourself.

# Mouse support (click to select window/pane, scroll, drag to resize)
set -g mouse on

# Ctrl+PageUp / Ctrl+PageDown → previous / next window (no prefix needed)
bind -n C-PPage previous-window
bind -n C-NPage next-window

# Keep the window names set via `tmux new-window -n <name>`. Without this the
# running program renames the window and `dev:start` can no longer tell which
# service is in which window — which is how it decides what is already running.
set -g allow-rename off
set -g automatic-rename off
set -g set-titles on

# A service that dies leaves its window and its last output on screen, rather
# than closing the window and taking the traceback with it.
set -g remain-on-exit on

# Enough scrollback to hold a startup traceback
set -g history-limit 20000

# Show the window name clearly in the status bar
set -g status-interval 5
setw -g window-status-format         ' #I:#W '
setw -g window-status-current-format ' #I:#W '
